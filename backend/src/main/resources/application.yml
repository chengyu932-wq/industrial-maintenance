server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: industrial-maintenance
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/industrial_maintenance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:maintenance_app}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: ${DB_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  storage:
    root: ${FILE_STORAGE_ROOT:./data/uploads}
  pdf:
    font-path: ${PDF_FONT_PATH:C:/Windows/Fonts/Noto Sans SC (TrueType).otf}
  maintenance:
    scan-cron: ${MAINTENANCE_SCAN_CRON:0 0 * * * *}
  dispatch:
    skill-weight: ${DISPATCH_SKILL_WEIGHT:0.40}
    load-weight: ${DISPATCH_LOAD_WEIGHT:0.30}
    team-weight: ${DISPATCH_TEAM_WEIGHT:0.20}
    area-weight: ${DISPATCH_AREA_WEIGHT:0.10}
  sla:
    scan-cron: ${SLA_SCAN_CRON:0 */5 * * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    captcha-ttl: ${CAPTCHA_TTL:2m}
    login-failure-window: ${LOGIN_FAILURE_WINDOW:10m}
    login-lock-ttl: ${LOGIN_LOCK_TTL:10m}
    max-login-failures: ${MAX_LOGIN_FAILURES:5}
